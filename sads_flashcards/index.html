<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق البطاقات التعليمية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for all questions view */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #4a5568; /* gray-700 for dark mode */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #60a5fa; /* blue-400 */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3b82f6; /* blue-500 */
        }
        /* Fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-4 text-gray-100">

    <div class="bg-gray-800 shadow-xl rounded-2xl p-6 md:p-8 w-full max-w-md mx-auto text-center border border-gray-700">
        <h1 class="text-3xl font-bold text-blue-400 mb-6">اختبار معاني الكلمات</h1>
        <p id="user-id-display" class="text-sm text-gray-400 mb-4 break-all"></p>

        <!-- Toggle Button for views -->
        <button id="toggle-view-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 ease-in-out transform hover:scale-105 shadow-md mb-4">
            عرض جميع الأسئلة
        </button>

        <!-- Flashcard View -->
        <div id="flashcard-view">
            <div id="question-card" class="bg-gray-700 border border-gray-600 rounded-xl p-4 mb-6 min-h-[120px] flex items-center justify-center">
                <p id="question-text" class="text-xl font-semibold text-gray-200 leading-relaxed"></p>
            </div>

            <button id="toggle-answer-btn" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl transition duration-300 ease-in-out transform hover:scale-105 shadow-md mb-4">
                إظهار الإجابة
            </button>

            <div id="answer-card" class="bg-green-800 border border-green-700 rounded-xl p-4 mb-6 text-left hidden animate-fade-in">
                <h3 class="text-lg font-bold text-green-300 mb-2">الإجابة الصحيحة:</h3>
                <p id="answer-text" class="text-green-100 text-base"></p>
                <p id="rationale-text" class="text-sm text-gray-300 mt-2"></p>
            </div>

            <div id="difficulty-buttons" class="flex justify-around space-x-2 md:space-x-4 mb-4 hidden">
                <button id="hard-btn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 ease-in-out transform hover:scale-105 shadow-md">
                    صعب
                </button>
                <button id="medium-btn" class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 ease-in-out transform hover:scale-105 shadow-md">
                    متوسط
                </button>
                <button id="easy-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 ease-in-out transform hover:scale-105 shadow-md">
                    سهل
                </button>
            </div>
            <button id="next-question-btn" class="w-full bg-gray-600 hover:bg-gray-700 text-gray-100 font-bold py-2 px-4 rounded-xl transition duration-300 ease-in-out transform hover:scale-105 shadow-sm">
                السؤال التالي
            </button>
        </div>

        <!-- All Questions View -->
        <div id="all-questions-view" class="text-left max-h-96 overflow-y-auto custom-scrollbar hidden">
            <h2 class="text-2xl font-bold text-blue-300 mb-4">جميع الأسئلة</h2>
            <div id="questions-list">
                <!-- Questions will be rendered here dynamically -->
            </div>
        </div>

        <p id="feedback-message" class="text-sm text-center mt-4 text-blue-400 animate-fade-in"></p>
    </div>

    <script type="module">
        // Firebase CDN imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables for Firebase config and app ID (provided by Canvas environment)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db;
        let auth;
        let userId;
        let isAuthReady = false;
        let userFlashcards = {}; // Stores user's progress for flashcards
        let currentQuestion = null;
        let showAnswer = false;
        let showAllQuestions = false; // State for toggling between views

        // Hardcoded questions (same as before)
        const ALL_QUESTIONS = [
            {
                id: "q1",
                question: "ما معنى كلمة \"إملاق\" في قوله تعالى: ﴿ وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ ﴾؟",
                answerOptions: [
                    { text: "مخافة فقر.", isCorrect: true },
                    { text: "كراهية شديدة.", isCorrect: false },
                    { text: "مرض عضال.", isCorrect: false },
                    { text: "جهل مطبق.", isCorrect: false }
                ]
            },
            {
                id: "q2",
                question: "ما معنى كلمة \"خطئاً\" في قوله تعالى: ﴿ إِنَّ قَتْلَهُمْ كَانَ خِطْنًا كَبِيرًا ﴾؟",
                answerOptions: [
                    { text: "إثماً وذنباً.", isCorrect: true },
                    { text: "خطأ غير مقصود.", isCorrect: false },
                    { text: "فعلاً حسناً.", isCorrect: false },
                    { text: "أمراً صعباً.", isCorrect: false }
                ]
            },
            {
                id: "q3",
                question: "ما معنى \"القسطاس المستقيم\" في سورة الإسراء؟",
                answerOptions: [
                    { text: "الميزان العادل.", isCorrect: true },
                    { text: "الطريق الصحيح.", isCorrect: false },
                    { text: "الحكم الصائب.", isCorrect: false },
                    { text: "الرزق الوفير.", isCorrect: false }
                ]
            },
            {
                id: "q4",
                question: "ماذا تعني كلمة \"مرحاً\" في قوله تعالى: ﴿ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا ﴾؟",
                answerOptions: [
                    { text: "فرحاً وبطراً، واختيالاً.", isCorrect: true },
                    { text: "سرعة في المشي.", isCorrect: false },
                    { text: "خوفاً ووجلاً.", isCorrect: false },
                    { text: "هدوءاً ووقاراً.", isCorrect: false }
                ]
            },
            {
                id: "q5",
                question: "ما معنى \"مدحوراً\" في الآية ﴿ فَتُلْقَى فِي جَهَنَّمَ مَلُومًا مَّدْحُورًا ﴾؟",
                answerOptions: [
                    { text: "مبعداً من رحمة الله.", isCorrect: true },
                    { text: "ممتلئاً بالندم.", isCorrect: false },
                    { text: "مكروهاً من الناس فقط.", isCorrect: false },
                    { text: "قوي الشكيمة.", isCorrect: false }
                ]
            },
            {
                id: "q6",
                question: "ماذا تعني عبارة \"أضغاث أحلام\" في سورة الأنبياء؟",
                answerOptions: [
                    { text: "مجرد أخلاط رآها في المنام.", isCorrect: true },
                    { text: "أحلام تتحقق في المستقبل.", isCorrect: false },
                    { text: "رؤى من الله تعالى.", isCorrect: false },
                    { text: "نبوات صادقة.", isCorrect: false }
                ]
            },
            {
                id: "q7",
                question: "ما معنى \"افتراه\" في قوله تعالى: ﴿ بَلِ افْتَرَهُ ﴾؟",
                answerOptions: [
                    { text: "اختلقه كذباً ولم يوح إليه.", isCorrect: true },
                    { text: "صدقه وآمن به.", isCorrect: false },
                    { text: "أوضح معناه للناس.", isCorrect: false },
                    { text: "فسره تفسيراً صحيحاً.", isCorrect: false }
                ]
            },
            {
                id: "q8",
                question: "ماذا يقصد بـ \"السفهاء\" في قوله تعالى: ﴿ وَلَا تُؤْتُوا السُّفَهَاءَ أَمْوَالَكُمُ ﴾؟",
                answerOptions: [
                    { text: "ضعاف العقول المبذرون لأموالهم.", isCorrect: true },
                    { text: "الأيتام الصغار الذين لم يبلغوا.", isCorrect: false },
                    { text: "الأشخاص الذين لا يملكون المال.", isCorrect: false },
                    { text: "الأعداء الذين يحاولون إيذاءكم.", isCorrect: false }
                ]
            },
            {
                id: "q9",
                question: "ما معنى \"نحلة\" في قوله تعالى: ﴿ وَآتُوا النِّسَاءَ صَدُقَاتِهِنَّ نِحْلَةً ﴾؟",
                answerOptions: [
                    { text: "عطية.", isCorrect: true },
                    { text: "قرض واجب السداد.", isCorrect: false },
                    { text: "دين مؤجل.", isCorrect: false },
                    { text: "ميراث مستحق.", isCorrect: false }
                ]
            },
            {
                id: "q10",
                question: "ماذا يقصد بـ \"يبسط الرزق\" و\"يقدر\" في قوله تعالى: ﴿ إِنَّ رَبَّكَ يَبْسُطُ الرِّزْقَ لِمَن يَشَاءُ وَيَقْدِرُ ﴾؟",
                answerOptions: [
                    { text: "يبسط الرزق: يعطي عطاءً جزيلاً؛ ويقدر: يضيق.", isCorrect: true },
                    { text: "يبسط الرزق: يمنع؛ ويقدر: يوسع.", isCorrect: false },
                    { text: "يبسط الرزق: يبارك فيه؛ ويقدر: يحدده بالضبط.", isCorrect: false },
                    { text: "يبسط الرزق: ينزله من السماء؛ ويقدر: يرفعه إلى السماء.", isCorrect: false }
                ]
            },
            {
                id: "q11",
                question: "ما معنى كلمة \"الكفر\" في سياق النص؟",
                answerOptions: [
                    { text: "ضد الإيمان، ومنه الجحود لله تعالى والتكذيب لرسوله وما جاء به من الدين والشرع.", isCorrect: true },
                    { text: "الجهل بالأمور الدنيوية.", isCorrect: false },
                    { text: "عدم الإخلاص في العمل.", isCorrect: false },
                    { text: "النسيان بعد المعرفة.", isCorrect: false }
                ]
            },
            {
                id: "q12",
                question: "ما معنى عبارة \"بعد إيمانهم\" في سورة آل عمران؟",
                answerOptions: [
                    { text: "أي: ارتدوا عن الإسلام إلى الكفر.", isCorrect: true },
                    { text: "أي: ثبتوا على إيمانهم.", isCorrect: false },
                    { text: "أي: ازدادت حسناتهم.", isCorrect: false },
                    { text: "أي: تعلموا ديناً جديداً.", isCorrect: false }
                ]
            },
            {
                id: "q13",
                question: "ما المقصود بكلمة \"الضالون\" في قوله تعالى: ﴿ وَأُوْلَئِكَ هُمُ الضَّالُونَ ﴾؟",
                answerOptions: [
                    { text: "المخطئون طريق الهدى.", isCorrect: true },
                    { text: "الذين لا يعلمون شيئاً.", isCorrect: false },
                    { text: "الذين يعملون الخير دائماً.", isCorrect: false },
                    { text: "الذين يتبعون الحق.", isCorrect: false }
                ]
            },
            {
                id: "q14",
                question: "ما معنى \"ملء الأرض ذهباً\" في سورة آل عمران؟",
                answerOptions: [
                    { text: "ما يملأها من الذهب.", isCorrect: true },
                    { text: "جزء صغير من الذهب.", isCorrect: false },
                    { text: "جميع كنوز الأرض.", isCorrect: false },
                    { text: "ثروة لا تقدر بثمن.", isCorrect: false }
                ]
            },
            {
                id: "q15",
                question: "ماذا تعني عبارة \"ولو افتدى به\"؟",
                answerOptions: [
                    { text: "ولو قدم فداء لنفسه من النار ما قبل منه.", isCorrect: true },
                    { text: "ولو كان له فداء من المال.", isCorrect: false },
                    { text: "ولو بذل جهده كله.", isCorrect: false },
                    { text: "ولو أتى بالحجج والبراهين.", isCorrect: false }
                ]
            }
        ];

        // DOM Elements
        const flashcardView = document.getElementById('flashcard-view');
        const allQuestionsView = document.getElementById('all-questions-view');
        const toggleViewBtn = document.getElementById('toggle-view-btn');
        const questionTextElem = document.getElementById('question-text');
        const toggleAnswerBtn = document.getElementById('toggle-answer-btn');
        const answerCardElem = document.getElementById('answer-card');
        const answerTextElem = document.getElementById('answer-text');
        const rationaleTextElem = document.getElementById('rationale-text');
        const difficultyButtonsDiv = document.getElementById('difficulty-buttons');
        const hardBtn = document.getElementById('hard-btn');
        const mediumBtn = document.getElementById('medium-btn');
        const easyBtn = document.getElementById('easy-btn');
        const nextQuestionBtn = document.getElementById('next-question-btn');
        const feedbackMessageElem = document.getElementById('feedback-message');
        const userIdDisplay = document.getElementById('user-id-display');
        const questionsListElem = document.getElementById('questions-list');

        // Functions
        function updateUI() {
            if (showAllQuestions) {
                flashcardView.classList.add('hidden');
                allQuestionsView.classList.remove('hidden');
                toggleViewBtn.textContent = 'العودة إلى البطاقات التعليمية';
                renderAllQuestions();
            } else {
                flashcardView.classList.remove('hidden');
                allQuestionsView.classList.add('hidden');
                toggleViewBtn.textContent = 'عرض جميع الأسئلة';
                renderCurrentQuestion();
            }
        }

        function renderCurrentQuestion() {
            if (currentQuestion) {
                questionTextElem.textContent = currentQuestion.question;
                answerCardElem.classList.add('hidden');
                difficultyButtonsDiv.classList.add('hidden');
                toggleAnswerBtn.textContent = 'إظهار الإجابة';
                showAnswer = false;
            } else {
                questionTextElem.textContent = 'لا توجد أسئلة للمراجعة حالياً.';
                toggleAnswerBtn.classList.add('hidden'); // Hide buttons if no questions
                nextQuestionBtn.classList.add('hidden');
                difficultyButtonsDiv.classList.add('hidden');
            }
        }

        function renderAllQuestions() {
            questionsListElem.innerHTML = ''; // Clear previous list
            ALL_QUESTIONS.forEach(q => {
                const flashcardStatus = userFlashcards[q.id];
                const correctAnswer = q.answerOptions.find(opt => opt.isCorrect)?.text || 'غير متوفر';
                const difficulty = flashcardStatus?.difficulty || 'جديد';
                const nextReview = flashcardStatus?.nextReviewTime ? formatReviewTime(flashcardStatus.nextReviewTime) : 'لم تتم المراجعة';

                const questionDiv = document.createElement('div');
                questionDiv.className = 'bg-gray-700 rounded-lg p-4 mb-3 border border-gray-600';
                questionDiv.innerHTML = `
                    <p class="font-semibold text-lg text-gray-200 mb-1">${q.question}</p>
                    <p class="text-green-400 text-sm">الإجابة: ${correctAnswer}</p>
                    <p class="text-gray-400 text-xs mt-1">
                        الصعوبة: <span class="font-bold ${difficulty === 'hard' ? 'text-red-400' : difficulty === 'medium' ? 'text-yellow-400' : 'text-green-400'}">${difficulty}</span> |
                        المراجعة التالية: ${nextReview}
                    </p>
                `;
                questionsListElem.appendChild(questionDiv);
            });
        }

        async function getNextQuestion() {
            showAnswer = false; // Reset answer visibility
            feedbackMessageElem.textContent = ''; // Clear feedback

            const now = Date.now();
            let nextQ = null;

            // 1. Prioritize 'hard' questions that are due now
            for (const q of ALL_QUESTIONS) {
                if (userFlashcards[q.id] && userFlashcards[q.id].difficulty === 'hard' && userFlashcards[q.id].nextReviewTime <= now) {
                    nextQ = q;
                    break;
                }
            }

            // 2. Prioritize 'medium' questions that are due now
            if (!nextQ) {
                for (const q of ALL_QUESTIONS) {
                    if (userFlashcards[q.id] && userFlashcards[q.id].difficulty === 'medium' && userFlashcards[q.id].nextReviewTime <= now) {
                        nextQ = q;
                        break;
                    }
                }
            }

            // 3. Prioritize 'easy' questions that are due now
            if (!nextQ) {
                for (const q of ALL_QUESTIONS) {
                    if (userFlashcards[q.id] && userFlashcards[q.id].difficulty === 'easy' && userFlashcards[q.id].nextReviewTime <= now) {
                        nextQ = q;
                        break;
                    }
                }
            }

            // 4. If no questions are due for review, pick a new unseen question
            if (!nextQ) {
                const availableNewQuestions = ALL_QUESTIONS.filter(q => !userFlashcards[q.id]);
                if (availableNewQuestions.length > 0) {
                    nextQ = availableNewQuestions[Math.floor(Math.random() * availableNewQuestions.length)];
                }
            }

            // 5. If all questions have been seen and reviewed, randomly pick one that's "least recently reviewed" (simplistic)
            if (!nextQ && ALL_QUESTIONS.length > 0) {
                const reviewedQuestions = ALL_QUESTIONS.filter(q => userFlashcards[q.id]);
                if (reviewedQuestions.length > 0) {
                    reviewedQuestions.sort((a, b) => (userFlashcards[a.id]?.nextReviewTime || 0) - (userFlashcards[b.id]?.nextReviewTime || 0));
                    nextQ = reviewedQuestions[0];
                } else {
                    nextQ = ALL_QUESTIONS[0]; // Fallback, should not happen if ALL_QUESTIONS is not empty
                }
            }

            currentQuestion = nextQ;
            renderCurrentQuestion(); // Update UI with the new question
        }

        async function markDifficulty(difficulty) {
            if (!db || !userId || !currentQuestion) {
                feedbackMessageElem.textContent = 'خطأ: لم يتم تهيئة قاعدة البيانات أو لا يوجد سؤال حالي.';
                return;
            }

            const questionId = currentQuestion.id;
            const now = Date.now();
            let nextReviewInterval = 0; // In milliseconds

            switch (difficulty) {
                case 'hard':
                    nextReviewInterval = 1 * 60 * 1000; // 1 minute
                    feedbackMessageElem.textContent = 'تم وضع علامة "صعب" - ستتكرر قريباً جداً!';
                    break;
                case 'medium':
                    nextReviewInterval = 15 * 60 * 1000; // 15 minutes
                    feedbackMessageElem.textContent = 'تم وضع علامة "متوسط" - ستتكرر بعد قليل.';
                    break;
                case 'easy':
                    nextReviewInterval = 24 * 60 * 60 * 1000; // 24 hours
                    feedbackMessageElem.textContent = 'تم وضع علامة "سهل" - ستتكرر بعد فترة طويلة.';
                    break;
                default:
                    console.warn('Unknown difficulty:', difficulty);
                    return;
            }

            const nextReviewTime = now + nextReviewInterval;
            const flashcardRef = doc(db, `artifacts/${appId}/users/${userId}/flashcards`, questionId);

            try {
                await setDoc(flashcardRef, {
                    difficulty,
                    nextReviewTime,
                    lastReviewed: now,
                    questionText: ALL_QUESTIONS.find(q => q.id === questionId)?.question || 'N/A'
                }, { merge: true });
                // No need to call getNextQuestion here as onSnapshot listener will trigger an update
            } catch (error) {
                console.error("Error updating flashcard difficulty:", error);
                feedbackMessageElem.textContent = 'خطأ في حفظ التقدم.';
            }
        }

        function formatReviewTime(timestamp) {
            if (!timestamp) return 'لم تتم المراجعة بعد';
            const date = new Date(timestamp);
            return date.toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });
        }

        // Event Listeners
        toggleViewBtn.addEventListener('click', () => {
            showAllQuestions = !showAllQuestions;
            updateUI();
        });

        toggleAnswerBtn.addEventListener('click', () => {
            showAnswer = !showAnswer;
            if (showAnswer) {
                answerCardElem.classList.remove('hidden');
                answerCardElem.classList.add('animate-fade-in');
                difficultyButtonsDiv.classList.remove('hidden');
                difficultyButtonsDiv.classList.add('animate-fade-in');
                toggleAnswerBtn.textContent = 'إخفاء الإجابة';
                const correctOption = currentQuestion.answerOptions.find(opt => opt.isCorrect);
                answerTextElem.textContent = correctOption ? correctOption.text : 'الإجابة غير متوفرة.';
                rationaleTextElem.textContent = correctOption ? correctOption.rationale : '';
            } else {
                answerCardElem.classList.add('hidden');
                difficultyButtonsDiv.classList.add('hidden');
                toggleAnswerBtn.textContent = 'إظهار الإجابة';
            }
        });

        hardBtn.addEventListener('click', () => markDifficulty('hard'));
        mediumBtn.addEventListener('click', () => markDifficulty('medium'));
        easyBtn.addEventListener('click', () => markDifficulty('easy'));
        nextQuestionBtn.addEventListener('click', getNextQuestion);


        // Initialization on window load
        window.onload = function() {
            // Initialize Firebase
            if (Object.keys(firebaseConfig).length === 0) {
                console.error("Firebase config is missing. Cannot initialize Firebase.");
                feedbackMessageElem.textContent = 'خطأ: إعدادات Firebase غير موجودة.';
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                    } else {
                        try {
                            if (initialAuthToken) {
                                await signInWithCustomToken(auth, initialAuthToken);
                                userId = auth.currentUser?.uid;
                            } else {
                                await signInAnonymously(auth);
                                userId = auth.currentUser?.uid;
                            }
                        } catch (error) {
                            console.error("Firebase Anonymous Auth failed:", error);
                            userId = crypto.randomUUID(); // Fallback to random ID if auth fails
                        }
                    }
                    isAuthReady = true;
                    userIdDisplay.textContent = `معرف المستخدم: ${userId}`;
                    fetchFlashcards(); // Start fetching data once auth is ready
                });
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                feedbackMessageElem.textContent = 'خطأ في تهيئة Firebase: ' + error.message;
            }
        };

        async function fetchFlashcards() {
            if (!db || !userId) {
                feedbackMessageElem.textContent = 'خطأ: لم يتم تهيئة قاعدة البيانات.';
                return;
            }

            try {
                const flashcardsCollectionRef = collection(db, `artifacts/${appId}/users/${userId}/flashcards`);
                const q = query(flashcardsCollectionRef);
                onSnapshot(q, (snapshot) => {
                    userFlashcards = {}; // Reset userFlashcards
                    snapshot.forEach((doc) => {
                        userFlashcards[doc.id] = doc.data();
                    });
                    // Only get next question if not showing all questions or if currentQuestion is null
                    if (!showAllQuestions && !currentQuestion) {
                        getNextQuestion();
                    } else if (showAllQuestions) {
                        // Re-render all questions to reflect changes in difficulty/review times
                        renderAllQuestions();
                    }
                    feedbackMessageElem.textContent = ''; // Clear loading/error messages
                }, (error) => {
                    console.error("Error listening to flashcards:", error);
                    feedbackMessageElem.textContent = 'خطأ في جلب بيانات البطاقات: ' + error.message;
                });
            } catch (error) {
                console.error("Error setting up flashcards listener:", error);
                feedbackMessageElem.textContent = 'خطأ في إعداد الاستماع للبطاقات: ' + error.message;
            }
        }
    </script>
</body>
</html>
