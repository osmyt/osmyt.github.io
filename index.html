    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lilita+One&display=swap');
*{
    margin: 0;
    padding: 0;
}
:root{
    --BG-Color: #363534;
    --BG2-Color: #212121;
    --main-Color: #fca272;
    --hover-Color: #f79059;
    --text-color: #fff;

    --main-font: 'Lilita One';
    --font: 'Archivo Black';

    --trans-speed: 0.3s;


    --TSize: 1.5rem;
    --main-TSize: 2.5rem;
    --social-size: 3rem;

    --box-width: 19rem;
    --box-height: 14rem;
    --box-TSize: 2rem;

    overflow: hidden;
}
body{
    display: flex;
    flex-direction: column;
    background-color: var(--BG-Color);
}
section{
    min-height: 100vh;
    padding: 8rem 9% 2rem;
}
.header{
    overflow: hidden;
    float: left;
    top: 0;
    width: 100%;
    z-index: 10;
    display: flex;
    position: fixed;
    align-items: center;
    box-shadow: 0px 0px 5px;
    font-family: var(--main-font);
    justify-content: space-between;
    backdrop-filter: blur(20px);
}
.logo{
    margin-left: 10px;
    font-size: 2.5rem;
    color: var(--text-color);
    font-weight: 600;
    text-decoration: none;
    font-family: var(--main-font);
}
.navbar{
    font-family: var(--main-font);
    background-color: transparent;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
}
.navbar a{
    font-size: var(--TSize);
    margin-right: 30px;
    color: var(--text-color);
    text-decoration: none;
    transition: var(--trans-speed);
}
.navbar a:hover,
.navbar a.active{
    color: var(--main-Color);
}

.Home{
    margin-top: -8rem;
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.Home-image img{
    transform: scaleX(-1);
    width: 100%;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0px 0px 10px;
}
.Home-cont{
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items:start;
}
.Home-cont h3{
    font-size: var(--TSize);
    font-weight: 800;
    font-family: var(--font);
    color: var(--text-color);
}
.Home-cont h3 span{color: var(--main-Color);}
.Home-cont h1{
    color: var(--main-Color);
    font-size: var(--main-TSize);
    line-height: 1.3;
    font-family: var(--main-font);
}
.Home-cont .social-icons{
    margin: 10px;
}
.social-icons a{
    font-size: var(--social-size);
    color: var(--main-Color);
}
.social-icons svg{
    width: 45px;
    height: 45px;
    fill: var(--main-Color);
}

.AboutBtn{
    margin-top: 10px;
    font-size: var(--TSize);
    font-family: var(--main-font);
    color: var(--text-color);
    text-decoration: none;  
    box-shadow: 0 0 10px var(--main-Color);
    display: inline-block;
    padding: 0.5rem 1rem;
    background-color: var(--main-Color);
    border: 0;
    border-radius: 15px;
    transition: var(--trans-speed);
}
.AboutBtn:hover{
    background-color: var(--text-color);
    color: var(--main-Color);
    box-shadow: none;
}
.AboutBtn:active{
    box-shadow: 0 0 10px var(--text-color);
}


.About{
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: var(--BG2-Color);
}
.About .title{
    font-size: var(--main-TSize);
    margin-bottom: 50px;
    color: var(--main-Color);
    font-family: var(--main-font);
}
.About-cont{
    font-size: var(--TSize);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.About-cont h3{
    color: var(--text-color);
    font-family: var(--font);
    margin-bottom: 30px;
}
.About-cont h3 span{
    color: var(--main-Color);
    font-family: var(--main-font);
    font-size: var(--main-TSize);
}

.Work{
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: var(--BG1-Color);
}
.Work .title{
    font-size: var(--main-TSize);
    margin-bottom: 50px;
    color: var(--main-Color);
    font-family: var(--main-font);
}
.Work-cont{
    font-size: var(--TSize);
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-content: center;
    flex-wrap: wrap;
    width: 100%;
}
.Work-cont .Web{
    width: var(--box-width);
    height: var(--box-height);
    border-radius: 10px;
    margin: 10px;
    background-color: var(--BG2-Color);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
    color: var(--main-Color);
    font-family: var(--main-font);
    transition: var(--trans-speed);
}
.Work-cont .Web img{
    border-radius: 10px 10px 0 0;
    width: 100%;
}
.Work-cont .Web .Web-title{
    width: 100%;
    height: 3rem;
    font-size: var(--box-TSize);
}
.Work-cont .Web:hover{
    box-shadow: 10px 10px #f79059;
}


@media only screen and (max-width: 790px){
    .home{
        flex-direction: column;
    }
    .home-cont{
        align-items: center;
    }

    .Home-image{
        margin: 70px 0px 20px 0px;
    }
    .Home-image img{
        position: relative;
        box-shadow: 0px 10px 40px #161513;
    }

    .Work-cont{
        flex-direction: column;
        align-content: center;
    }
    .Work-cont .Web{
        margin-right: 0px;
        margin-bottom: 15px;
    }
}
    </style>
